<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Serviço Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f2f5;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #e1f5fe;
      color: #0288d1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 15px;
    }
    h2 {
      color: #1a1a1a;
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      color: #666666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .price-box {
      background: #fafafa;
      border: 1px solid #eaeaea;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
    }
    .price {
      font-size: 32px;
      font-weight: 700;
      color: #0070ba;
    }
    .currency {
      font-size: 16px;
      color: #555555;
    }
    #paypal-button-container {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Pagamento Seguro</span>
    <h2>Acesso ao Serviço Digital</h2>
    <p>Clique no botão abaixo para concluir o pagamento via PayPal.</p>

    <div class="price-box">
      <div class="price">$ 2.97 <span class="currency">USD</span></div>
    </div>

    <!-- Container onde o botão do PayPal será exibido -->
    <div id="paypal-button-container"></div>
  </div>

  <!-- SDK do PayPal com Moeda USD configurada -->
  <!-- BAAFktvw_LhUpKGdPwh6XxQdwu9pjyyquILl7kQDH-xp8wQT7SuT3hECQPiRcWUcqog-AzKG-zDWg6Zezo -->
  <script src="https://www.paypal.com/sdk/js?client-id=SEU_CLIENT_ID&currency=USD"></script>

  <script>
    paypal.Buttons({
      // 1. Cria a ordem de $ 2.97 USD
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: {
              currency_code: 'USD',
              value: '2.97'
            },
            description: 'Serviço Digital'
          }]
        });
      },
      // 2. Executa após a confirmação do cliente
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          alert('Pagamento de $2.97 aprovado com sucesso! Obrigado, ' + details.payer.name.given_name);
          // Opcional: Redirecionar para a página de entrega/agradecimento
          // window.location.href = "https://seu-site.com/obrigado";
        });
      },
      // 3. Trata erros no fluxo de checkout
      onError: function(err) {
        console.error('Erro no checkout:', err);
        alert('Ocorreu um problema ao processar o pagamento. Tente novamente.');
      }
    }).render('#paypal-button-container');
  </script>

</body>
</html>
